name: Waka Readme

on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch WakaTime stats and update README
        run: python .github/scripts/update_waka.py
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_OAUTH_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/waka-stats.svg
          git diff --cached --quiet || (git commit -m "Updated waka-readme graph with new metrics" && git push)
